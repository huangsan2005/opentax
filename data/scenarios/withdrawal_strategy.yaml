# 场景：提款/开票节奏寻优（同一份工程合同的合法节奏对比）
# 只枚举合法结构：何时开票、几期开票；不涉及任何虚开/隐匿选项。
id: withdrawal_strategy
title: 同一工程合同的开票节奏对比（小规模施工方）
pipeline: engineering_to_owner_staged
result_var: owner_net
axes:
  - var: n_periods
    values: ["1", "2", "3", "4"]
    labels:
      "1": 全部集中单季开票
      "2": 两季各半
      "3": 三季各三分之一
      "4": 四季均匀
assumptions:
  - 小规模纳税人，按季申报（季度销售额30万免征线）
  - 当年在 2023-2027 减按1% 征收率窗口内
  - 查账征收小型微利企业，全年应纳税所得额≤300万档位由数据决定
  - 成本费用在各期间均衡发生，无跨年结转
  - 利润当年全额分红给自然人股东
