# 印花税（产权转移书据）+ 车船税 —— 2026-08-29 官方来源核验入库
#
# 印花税法：fgk.chinatax.gov.cn/zcfgk/c100009/c5193058（2022-07-01施行）
#   正文核验：第五条计税依据四款、第九条未分别列明金额从高适用税率、
#   第二十条施行日。附表《税目税率表》为PPT附件（库内URL 404，不可机读）。
#   产权转移书据各族税率经山西省税务局官方问答页逐字引用附表核验：
#   shanxi.chinatax.gov.cn/web/detail/sx-11400-548-1784100
#   —— 土地使用权出让/房屋转让/股权转让书据：万分之五
#   —— 商标/著作权/专利/专有技术使用权转让书据：万分之三
#
# 车船税法：fgk.chinatax.gov.cn/zcfgk/c100009/c5193039（2012-01-01施行）
#   法条只定税额幅度，具体税额省定。乘用车7档法定区间为全国统一，
#   各档具体金额取 北京市车辆车船税税目税额表（北京市税务局附件doc
#   已解析核验）。其他省金额不同，请按同id多版本/独立id补充。
meta:
  jurisdiction: cn
  category: 财产和行为税

tables:
  # ---- 印花税·产权转移书据（印花税法附表）-----------------------
  - id: cn/stamp/property_transfer_land_house_equity
    primitive: flat
    description: 产权转移书据（土地出让/房屋转让/股权转让书据）万分之五
    effective: ["2022-07-01", null]
    priority: 0
    source:
      title: 印花税法附表《印花税税目税率表》（经山西省税务局官方问答页逐字引用核验）
      doc_no: 主席令2021年第八十九号
      url: http://shanxi.chinatax.gov.cn/web/detail/sx-11400-548-1784100
    last_verified: "2026-08-29"
    verified_by: null
    inputs: [base]
    notes:
      - "计税依据=书据所列金额，不包括列明的增值税税款（印花税法第五条第二款）"
      - "股权转让书据不包括应缴纳证券交易印花税的（证券交易单列税目，本表未含）"
      - "附表PPT在法规库不可机读——各族税率以税务局官方引文+社区复核为准"
    params: {rate: "0.0005"}

  - id: cn/stamp/property_transfer_ip
    primitive: flat
    description: 产权转移书据（商标专用权/著作权/专利权/专有技术使用权转让）万分之三
    effective: ["2022-07-01", null]
    priority: 0
    source:
      title: 印花税法附表《印花税税目税率表》（山西省税务局官方问答页引用）
      doc_no: 主席令2021年第八十九号
      url: http://shanxi.chinatax.gov.cn/web/detail/sx-11400-548-1784100
    last_verified: "2026-08-29"
    verified_by: null
    inputs: [base]
    notes:
      - "同上：计税依据不含列明增值税税款"
    params: {rate: "0.0003"}

