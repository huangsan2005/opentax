#     各带本国法律来源；同 id 的历史版本再按 effective 拆条目。
#   - 数字来源：欧盟委员会 Taxes in Europe 数据库 / 各国税务局官网，
#     last_verified 2026-08-28。社区核验时请附各国官方链接并补历史版本。
